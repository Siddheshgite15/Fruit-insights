version: "3.9"

services:
  fruit-api:
    build: .
    image: fruit-shelf-life-api:latest
    container_name: fruit-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount models & static at runtime so you can swap weights without rebuilding
      - ./models:/app/models:ro
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
